<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Platform Zero</title><style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}</style>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Big+Shoulders+Display:wght@700;800&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Layout concept: a station departure board (dark slab, amber type) over a cool enamel-signage ground; map fills the screen, controls dock beside or below it. */
:root {
  --bg: #E7EBEE; --panel: #F6F8F9; --raise: #FFFFFF; --ink: #131A23; --muted: #55616E; --rule: #CAD2D9;
  --map: #DEE4E8; --accent: #B87400; --accent-fill: #F2A900; --on-accent: #161A1F;
  --slab: #10161E; --slab-ink: #F2B33D; --slab-dim: #8A7550;
  --good: #23804F; --bad: #BF3A2E; --halo: #DEE4E8;
  --f-display: 'Big Shoulders Display', 'Arial Narrow', 'Roboto Condensed', sans-serif;
  --f-body: 'Atkinson Hyperlegible', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --f-mono: 'IBM Plex Mono', ui-monospace, 'SFMono-Regular', Menlo, monospace;
  --r: 6px; --water: #BED6E6;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0B1016; --panel: #111820; --raise: #17202B; --ink: #E3E9EF; --muted: #8E9BA8; --rule: #253141;
  --map: #0E151D; --accent: #F2B33D; --accent-fill: #F2B33D; --on-accent: #161A1F;
  --slab: #06090D; --slab-ink: #F2B33D; --slab-dim: #8A7550; --good: #4CC488; --bad: #F06A5C; --halo: #0E151D; --water: #15304A; color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #0B1016; --panel: #111820; --raise: #17202B; --ink: #E3E9EF; --muted: #8E9BA8; --rule: #253141;
  --map: #0E151D; --accent: #F2B33D; --accent-fill: #F2B33D; --on-accent: #161A1F;
  --slab: #06090D; --slab-ink: #F2B33D; --slab-dim: #8A7550; --good: #4CC488; --bad: #F06A5C; --halo: #0E151D; --water: #15304A; color-scheme: dark; }

[hidden] { display: none !important; }
html, body { height: 100%; }
body { background: var(--bg); color: var(--ink); font: 15px/1.45 var(--f-body); overflow: hidden; }
* { box-sizing: border-box; }
button, input, select { font: inherit; color: inherit; }
.mono { font-family: var(--f-mono); font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }
.small { font-size: 13px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
h1, h2, h3, h4 { text-wrap: balance; margin: 0; }
p { margin: 0; }

#app { height: 100%; display: flex; flex-direction: column; }
.slab { background: var(--slab); color: var(--slab-ink); display: flex; align-items: center; gap: 14px; padding-block: 8px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); min-height: 52px; flex: none; }
.brand { background: none; border: 0; padding: 0; cursor: pointer; color: var(--slab-ink); font: 800 22px/1 var(--f-display); letter-spacing: .05em; text-transform: uppercase; display: flex; gap: .3em; }
.brand span { color: #E9EEF2; }
.clock { margin-left: auto; white-space: nowrap; display: flex; align-items: baseline; gap: 10px; font: 600 13px var(--f-mono); color: var(--slab-dim); text-transform: uppercase; letter-spacing: .08em; }
#clkTime { font-size: 22px; color: var(--slab-ink); letter-spacing: .04em; }
#clkState { color: #E9EEF2; }
.slabbtn { background: transparent; color: var(--slab-ink); border: 1px solid var(--slab-dim); border-radius: 4px; padding: 6px 12px; font: 600 13px var(--f-mono); text-transform: uppercase; letter-spacing: .06em; cursor: pointer; }
.slabbtn:hover { border-color: var(--slab-ink); }

main { flex: 1; min-height: 0; position: relative; }
.view { position: absolute; inset: 0; }
.scroll { overflow-y: auto; -webkit-overflow-scrolling: touch; }
.wrap { max-width: 1040px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 28px 64px; display: flex; flex-direction: column; gap: 22px; }

/* buttons */
.primary, .ghost, .chip, .mini, .qbtn, .link { cursor: pointer; }
.primary { background: var(--accent-fill); color: var(--on-accent); border: 0; border-radius: var(--r); padding: 10px 16px; font-weight: 700; }
.primary:hover:not(:disabled) { filter: brightness(1.06); }
.primary.big { font-size: 17px; padding: 14px 22px; align-self: flex-start; }
.ghost { background: transparent; border: 1px solid var(--rule); border-radius: var(--r); padding: 9px 14px; }
.ghost:hover:not(:disabled) { border-color: var(--ink); }
.ghost.danger { color: var(--bad); border-color: color-mix(in srgb, var(--bad) 45%, var(--rule)); }
button:disabled { opacity: .45; cursor: not-allowed; }
.link { background: none; border: 0; padding: 0; color: var(--accent); text-decoration: underline; text-underline-offset: 3px; align-self: flex-start; }
.mini { font-size: 13px; padding: 5px 10px; border-radius: 4px; border: 0; background: var(--ink); color: var(--bg); }
.mini.ghost { background: transparent; color: var(--ink); border: 1px solid var(--rule); }
input, select { background: var(--raise); border: 1px solid var(--rule); border-radius: var(--r); padding: 9px 11px; min-width: 0; }
input:focus, select:focus { border-color: var(--accent); }
.inline { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.inline input { flex: 1 1 180px; }
.inline.gap { gap: 10px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { border: 1px solid var(--rule); background: var(--raise); border-radius: 999px; padding: 6px 12px; font-size: 14px; }
.chip.on { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.chip .lchip { margin: -2px -4px; }
.eyebrow { display: block; font: 600 11px var(--f-mono); letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
.lede { font-size: 17px; max-width: 62ch; }
.check { display: flex; gap: 8px; align-items: flex-start; cursor: pointer; }
.check input { margin-top: 4px; }
.tag { font: 600 10px var(--f-mono); text-transform: uppercase; letter-spacing: .08em; border: 1px solid var(--rule); border-radius: 3px; padding: 1px 5px; color: var(--muted); vertical-align: 2px; }
.dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 8px; flex: none; }
.lchip { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 700; padding: 2px 8px 2px 6px; border-radius: 4px; background: color-mix(in srgb, var(--lc) 16%, transparent); border-left: 4px solid var(--lc); white-space: nowrap; }
.lchip.walk { --lc: var(--muted); }
.teamchip { display: inline-block; font-size: 12px; font-weight: 700; padding: 1px 8px; border-radius: 999px; background: color-mix(in srgb, var(--tc) 18%, transparent); color: var(--ink); border: 1px solid color-mix(in srgb, var(--tc) 55%, transparent); }

/* home */
.hero { padding-top: 12px; display: flex; flex-direction: column; gap: 12px; }
.hero h1 { font: 800 clamp(40px, 8vw, 76px)/.92 var(--f-display); text-transform: uppercase; letter-spacing: .01em; max-width: 14ch; }
.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px; }
.tile { background: var(--raise); border: 1px solid var(--rule); border-radius: var(--r); padding: 16px; display: flex; flex-direction: column; gap: 10px; border-top: 6px solid var(--slab); }
.tile h3 { font: 800 28px/1 var(--f-display); text-transform: uppercase; letter-spacing: .02em; }
.tile p { color: var(--muted); flex: 1; }
.tile-acts { display: flex; gap: 8px; flex-wrap: wrap; }
.row2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 12px; }
.panelcard { background: var(--panel); border: 1px solid var(--rule); border-radius: var(--r); padding: 16px; display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.panelcard h2, .lobby h2, .setup h2 { font: 800 22px/1.1 var(--f-display); text-transform: uppercase; letter-spacing: .03em; }
.glist { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
.glist li { display: flex; gap: 6px; }
.gl { flex: 1; display: flex; gap: 12px; align-items: baseline; text-align: left; background: var(--raise); border: 1px solid var(--rule); border-radius: var(--r); padding: 9px 12px; cursor: pointer; min-width: 0; }
.gl span { color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.x { background: none; border: 0; color: var(--muted); font-size: 13px; cursor: pointer; text-decoration: underline; }
.foot { color: var(--muted); font-size: 13px; max-width: 70ch; }

/* setup */
.setup h1, .lobby h1 { font: 800 44px/1 var(--f-display); text-transform: uppercase; }
.step { display: flex; flex-direction: column; gap: 10px; }
.step h2 { display: flex; align-items: center; gap: 10px; }
.num { font: 600 13px/1 var(--f-mono); background: var(--slab); color: var(--slab-ink); border-radius: 3px; padding: 5px 7px; }
.presets { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 8px; }
.preset { text-align: left; background: var(--raise); border: 1px solid var(--rule); border-radius: var(--r); padding: 12px; display: flex; flex-direction: column; gap: 4px; cursor: pointer; border-top: 5px solid var(--rule); }
.preset b { font: 800 22px/1 var(--f-display); text-transform: uppercase; letter-spacing: .02em; }
.preset span { font-size: 13px; color: var(--muted); }
.preset.on { border-color: var(--ink); border-top-color: var(--accent-fill); background: color-mix(in srgb, var(--accent-fill) 10%, var(--raise)); }
.preset:hover:not(:disabled):not(.on) { border-color: var(--muted); }
.status-line { min-height: 1.4em; color: var(--muted); }
.preview { margin: 0; border: 1px solid var(--rule); border-radius: var(--r); overflow: hidden; background: var(--map); }
.preview svg { width: 100%; height: 320px; display: block; touch-action: none; }
.preview figcaption { display: flex; flex-direction: column; gap: 4px; padding: 10px 12px; background: var(--panel); border-top: 1px solid var(--rule); }
.preview figcaption b { font: 800 22px/1 var(--f-display); text-transform: uppercase; }
.legend { display: flex; flex-wrap: wrap; gap: 4px 12px; font-size: 13px; color: var(--muted); }
.legend i { display: inline-block; width: 14px; height: 4px; border-radius: 2px; margin-right: 5px; vertical-align: 3px; }
.fields { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 12px; }
.fld { display: flex; flex-direction: column; gap: 5px; }
.fld span { font-size: 13px; color: var(--muted); }

/* lobby */
.codeslab { background: var(--slab); color: var(--slab-ink); border-radius: var(--r); padding: 18px; display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }
.codeslab .eyebrow { color: var(--slab-dim); }
.codeslab b { font-size: clamp(40px, 10vw, 64px); letter-spacing: .18em; line-height: 1; }
.plist { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
.plist li { display: flex; align-items: center; gap: 10px; background: var(--raise); border: 1px solid var(--rule); border-radius: var(--r); padding: 10px 12px; flex-wrap: wrap; }
.plist .pn { flex: 1; min-width: 0; }
.plist em { color: var(--muted); font-style: normal; }
.lobby-acts { display: flex; flex-direction: column; gap: 8px; }
.waiting { font: 600 15px var(--f-mono); color: var(--muted); }

/* play */
.play { display: grid; grid-template-rows: minmax(0, 1fr) minmax(0, 46%); }
.play.expanded { grid-template-rows: minmax(0, 32%) minmax(0, 1fr); }
.mapwrap { position: relative; background: var(--map); min-height: 0; overflow: hidden; }
#map { width: 100%; height: 100%; display: block; touch-action: none; user-select: none; -webkit-user-select: none; cursor: grab; }
.maptools { position: absolute; right: max(10px, env(safe-area-inset-right, 0px)); top: 10px; display: flex; flex-direction: column; gap: 6px; }
.maptools button { width: 42px; height: 38px; border-radius: var(--r); border: 1px solid var(--rule); background: var(--raise); font: 600 13px var(--f-mono); cursor: pointer; }
#toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(18px + env(safe-area-inset-bottom, 0px)); z-index: 30; background: var(--slab); color: #EEF2F5; padding: 10px 16px; border-radius: var(--r); max-width: min(92vw, 520px); font-size: 14px; box-shadow: 0 6px 24px rgb(0 0 0 / .28); border-left: 4px solid var(--slab-ink); }
.panel { display: flex; flex-direction: column; min-height: 0; background: var(--panel); border-top: 1px solid var(--rule); }
.pstatus { padding-block: 10px 8px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); border-bottom: 1px solid var(--rule); display: flex; flex-direction: column; gap: 6px; }
.st-main { display: flex; gap: 10px; align-items: baseline; flex-wrap: wrap; }
.role { font: 800 15px/1 var(--f-display); text-transform: uppercase; letter-spacing: .06em; background: var(--ink); color: var(--bg); padding: 4px 8px 3px; border-radius: 3px; }
.role.r-hider, .role.r-chaser { background: var(--accent-fill); color: var(--on-accent); }
.st-notes { display: flex; flex-wrap: wrap; gap: 6px; }
.st-notes span { font-size: 13px; background: color-mix(in srgb, var(--accent-fill) 18%, transparent); border: 1px solid color-mix(in srgb, var(--accent-fill) 50%, transparent); padding: 2px 8px; border-radius: 4px; }
.tabs { display: flex; gap: 2px; overflow-x: auto; padding-left: max(10px, env(safe-area-inset-left, 0px)); padding-right: max(10px, env(safe-area-inset-right, 0px)); border-bottom: 1px solid var(--rule); flex: none; }
.tab { background: none; border: 0; border-bottom: 3px solid transparent; padding: 10px 10px 8px; font: 700 13px var(--f-mono); text-transform: uppercase; letter-spacing: .06em; color: var(--muted); cursor: pointer; white-space: nowrap; }
.tab.on { color: var(--ink); border-bottom-color: var(--accent-fill); }
.tab.grow { margin-left: auto; }
.pbody { flex: 1; overflow-y: auto; padding-block: 14px 28px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: flex; flex-direction: column; gap: 14px; }
.pbody h4 { font: 800 17px/1.1 var(--f-display); text-transform: uppercase; letter-spacing: .04em; }
.pbody .chips { align-items: center; }
.here { font-size: 15px; }
.trip { display: flex; flex-direction: column; gap: 8px; background: var(--raise); border: 1px solid var(--rule); border-left: 4px solid var(--accent-fill); border-radius: var(--r); padding: 10px 12px; }
.stcard { display: flex; flex-direction: column; gap: 10px; }
.stcard h3 { font: 800 30px/1 var(--f-display); text-transform: uppercase; letter-spacing: .01em; }
.meta { color: var(--muted); font-size: 14px; }
.blocked { color: var(--bad); font-size: 14px; }
.plan { display: flex; flex-direction: column; gap: 8px; border-top: 1px dashed var(--rule); padding-top: 10px; }
.eta { font-size: 15px; }
.eta b { font-family: var(--f-mono); font-size: 20px; }
.legs { margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: 4px; font-size: 14px; }
.plan .primary { align-self: flex-start; }
.chal, .thermo, .pending, .draw, .callout, .shop { background: var(--raise); border: 1px solid var(--rule); border-radius: var(--r); padding: 12px; display: flex; flex-direction: column; gap: 8px; }
.chal .primary, .callout .primary, .callout .ghost, .thermo .ghost { align-self: flex-start; }
.pending { border-left: 4px solid var(--accent-fill); }
.callout.host { border-color: var(--accent-fill); }
.reward { font: 600 13px var(--f-mono); }
.qlist { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
.qbtn { width: 100%; text-align: left; background: var(--raise); border: 1px solid var(--rule); border-radius: var(--r); padding: 10px 12px; display: flex; flex-direction: column; gap: 2px; }
.qbtn:hover:not(:disabled) { border-color: var(--ink); }
.qbtn em { font-style: normal; font-size: 12px; color: var(--muted); }
.cands { display: grid; grid-template-columns: auto 1fr; gap: 0 12px; align-items: center; }
.cands .check { grid-column: 1 / -1; margin-top: 6px; font-size: 14px; }
.big-num { font-size: 40px; font-weight: 600; line-height: 1; color: var(--accent); }
.zone-note { background: color-mix(in srgb, var(--good) 14%, transparent); border-left: 4px solid var(--good); padding: 8px 10px; border-radius: 4px; }
.answers { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
.answers li { display: flex; justify-content: space-between; gap: 12px; border-bottom: 1px solid var(--rule); padding-bottom: 8px; }
.answers p { min-width: 0; font-size: 14px; }
.ans { font: 600 14px var(--f-mono); white-space: nowrap; color: var(--accent); }
.ans.veto { color: var(--bad); }
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; }
.card { text-align: left; background: var(--raise); border: 1px solid var(--rule); border-radius: var(--r); padding: 10px; display: flex; flex-direction: column; gap: 4px; border-top: 5px solid var(--muted); min-width: 0; }
button.card { cursor: pointer; }
.card.k-tb { border-top-color: var(--good); }
.card.k-curse { border-top-color: var(--bad); }
.card.k-power { border-top-color: #3D7BC4; }
.card.on { outline: 2px solid var(--accent); outline-offset: 1px; background: color-mix(in srgb, var(--accent-fill) 12%, var(--raise)); }
.card b { font: 800 19px/1.05 var(--f-display); text-transform: uppercase; }
.ck { font: 600 10px var(--f-mono); text-transform: uppercase; letter-spacing: .1em; color: var(--muted); }
.ct { font-size: 13px; color: var(--muted); }
.cacts { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 4px; }
.score { width: 100%; border-collapse: collapse; font-size: 14px; }
.score th { text-align: left; font: 600 11px var(--f-mono); text-transform: uppercase; letter-spacing: .08em; color: var(--muted); border-bottom: 1px solid var(--rule); padding: 6px 4px; }
.score td { padding: 8px 4px; border-bottom: 1px solid var(--rule); }
.score tr.it td { font-weight: 700; }
.results-h { font: 800 28px/1 var(--f-display); text-transform: uppercase; }
.teams { display: grid; grid-template-columns: repeat(auto-fit, minmax(90px, 1fr)); gap: 8px; }
.team { border: 1px solid var(--rule); border-top: 5px solid var(--tc); border-radius: var(--r); padding: 8px 10px; display: flex; flex-direction: column; background: var(--raise); }
.team .mono { font-size: 28px; font-weight: 600; line-height: 1.1; }
.team small { color: var(--muted); }
.dlist { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
.dbtn { width: 100%; display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: center; text-align: left; background: var(--raise); border: 1px solid var(--rule); border-radius: var(--r); padding: 9px 12px; cursor: pointer; }
.dbtn .dn { font-weight: 700; flex: 1 1 140px; }
.dbtn em { font-style: normal; color: var(--bad); font-size: 13px; }
.log { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; font-size: 14px; }
.log li { display: grid; grid-template-columns: 48px 1fr; gap: 8px; border-bottom: 1px solid var(--rule); padding-bottom: 6px; }
.log li > span:last-child { min-width: 0; }
.log .t { color: var(--accent); font-size: 13px; }

/* map marks */
.m-bg { fill: var(--map); }
.m-st { fill: var(--raise); }
.m-sel { fill: none; stroke: var(--accent-fill); }
.m-zone { fill: color-mix(in srgb, var(--good) 10%, transparent); stroke: var(--good); }
.m-route { fill: none; stroke: var(--accent-fill); opacity: .38; }
.m-railtie { stroke: var(--map); }
.m-poi rect { fill: var(--raise); stroke: var(--muted); }
.m-poi text { fill: var(--muted); text-anchor: middle; font-family: var(--f-mono); font-weight: 600; }
.m-poi .m-poil { text-anchor: start; font-family: var(--f-body); font-weight: 400; font-style: italic; paint-order: stroke; stroke: var(--halo); }
.m-lbl { fill: var(--ink); font-family: var(--f-body); font-weight: 700; paint-order: stroke; stroke: var(--halo); stroke-linejoin: round; pointer-events: none; }
.m-lbl.out { opacity: .3; }
.m-lbl.sel { fill: var(--accent); }
.m-tok circle { stroke: var(--raise); }
.m-tok text { fill: #fff; text-anchor: middle; font-family: var(--f-mono); font-weight: 600; pointer-events: none; }
.m-me { fill: none; stroke: var(--ink); }
.m-ghost circle { fill: none; }
.m-ghost text { text-anchor: middle; font-family: var(--f-mono); font-weight: 600; }

/* water, landmarks, photos */
.m-water { fill: var(--water); }
.m-mark polygon { fill: none; stroke: var(--muted); }
.m-mark text { fill: var(--muted); font-family: var(--f-body); font-style: italic; paint-order: stroke; stroke: var(--halo); }
.photo { display: block; width: 100%; max-width: 440px; height: auto; border-radius: 6px; box-shadow: 0 1px 0 var(--rule); }
.pano { overflow-x: auto; border-radius: 6px; max-width: 100%; }
.photo-ans { flex-direction: column; align-items: stretch !important; }
.pending .photo, .pending .pano { margin-top: 4px; }
.guide { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 6px; }
.guide li { display: flex; gap: 10px; align-items: center; border: 1px solid var(--rule); border-radius: var(--r); padding: 6px 8px; background: var(--raise); }
.guide span { display: flex; flex-direction: column; }
.guide small { color: var(--muted); }
.credit { color: var(--muted); font-size: 12px; }

/* modal */
.modal { position: fixed; inset: 0; background: rgb(6 9 13 / .55); display: flex; align-items: flex-end; justify-content: center; z-index: 20; padding: 12px; padding-bottom: max(12px, env(safe-area-inset-bottom, 0px)); }
.sheet { background: var(--panel); border-radius: 10px; width: min(560px, 100%); max-height: 88vh; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 12px; border-top: 6px solid var(--slab); }
.sheet h2 { font: 800 28px/1 var(--f-display); text-transform: uppercase; }
.mrow { display: flex; gap: 8px; justify-content: flex-end; flex-wrap: wrap; }
.mlist { display: flex; flex-direction: column; gap: 8px; }
.mlist .ghost { text-align: left; }
.rules { margin: 0; padding-left: 22px; display: flex; flex-direction: column; gap: 8px; }
.cats { margin: 0; padding-left: 18px; display: flex; flex-direction: column; gap: 6px; font-size: 14px; }
.dice { display: flex; gap: 8px; flex-wrap: wrap; min-height: 56px; align-items: center; }
.die { font-size: 50px; line-height: 1; }
.die.bust { color: var(--bad); }
.seq { display: flex; flex-wrap: wrap; gap: 6px; min-height: 34px; }
.sw { padding: 6px 10px; border-radius: 4px; background: var(--lc); color: #fff; font-weight: 700; font-size: 13px; text-shadow: 0 1px 1px rgb(0 0 0 / .4); }
.sums { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 8px; }
.sums label { display: flex; align-items: center; gap: 8px; }
.sums input { width: 80px; }
.sums .mrow { grid-column: 1 / -1; }

@media (min-width: 860px) {
  .play, .play.expanded { grid-template-rows: 1fr; grid-template-columns: minmax(0, 1fr) 410px; }
  .panel { border-top: 0; border-left: 1px solid var(--rule); }
  .tab.grow { display: none; }
  .modal { align-items: center; }
}
@media (max-width: 520px) { .brand { font-size: 18px; } #clkDay { font-size: 11px; } .clock { gap: 6px; } #clkTime { font-size: 19px; } .slab { gap: 10px; } .slabbtn { padding: 5px 8px; } }
@media (prefers-reduced-motion: reduce) { * { scroll-behavior: auto !important; } }

.pbody > *, .sheet > * { flex-shrink: 0; }

      </aside>
    </section>
  </main>
  <div id="toast" role="status" hidden></div>

// ---------- utilities
function rng(seed) {

const r2 = v => Math.round(v * 100) / 100;

const SPEED = { metro: 33, rail: 62, tram: 18, bus: 16 };      // km/h, average incl. stops

const MODE_LABEL = { metro: 'Metro', rail: 'Rail', tram: 'Tram', bus: 'Bus' };

const POI_KINDS = ['airport', 'stadium', 'museum', 'park', 'hospital', 'university'];
const POI_WORD = { airport: ['airport', 'airports'], stadium: ['stadium', 'stadiums'], museum: ['museum', 'museums'], park: ['park', 'parks'], hospital: ['hospital', 'hospitals'], university: ['university', 'universities'] };

// ---------- fictional city generator
const NA = ['Ash', 'Bram', 'Cole', 'Dun', 'Elm', 'Fen', 'Gar', 'Hol', 'Kel', 'Lark', 'Mar', 'Nor', 'Oak', 'Pen', 'Rook', 'Sal', 'Thorn', 'Wick', 'Yar', 'Brack', 'Stan', 'Chal', 'Hart', 'Lang', 'Mere', 'Wren', 'Cran', 'Fair', 'Grey', 'High', 'Ox', 'Red', 'Silver', 'Stone', 'Wool', 'Kings', 'Queens', 'Mill', 'Brook', 'Fox', 'Bell', 'Clay', 'Har', 'Lea', 'Tam', 'Wen', 'Ald', 'Bar', 'Hay', 'Rad'];
const NB = ['bridge', 'field', 'gate', 'ford', 'wood', 'ley', 'ham', 'ton', 'stead', 'wick', 'well', 'marsh', 'cross', 'hill', 'mouth', 'combe', 'dale', 'bury', 'minster', 'haven', 'thorpe', 'green', 'row', 'lands', 'port', 'side', 'mere', 'brook', 'well', 'heath'];
const LINE_NAMES = ['Crown', 'River', 'Garden', 'Harbour', 'Union', 'Meridian', 'Market', 'Forest', 'Canal', 'Cathedral', 'Beacon', 'Jubilee'];
function makeNamer(r) {
  const used = new Set();
  return function (plain) {
    for (let k = 0; k < 300; k++) {
      let n = pick(r, NA) + pick(r, NB);
      if (!plain) { const v = r(); if (v < 0.1) n += ' Road'; else if (v < 0.17) n += ' Park'; else if (v < 0.21) n += ' Cross'; else if (v < 0.24) n += ' Lane'; }

}
function genCity(seed) {

  const city = namer(true);

    let best = null, bd = thr;
    for (const s of st) { const d = Math.hypot(s.x - x, s.y - y); if (d < bd) { bd = d; best = s; } }
    if (best) return best;
    const s = { id: 's' + st.length, n: namer(), x: r2(x), y: r2(y) };
    st.push(s); return s;
  }
  const central = { id: 's0', n: city + ' Central', x: 0.2, y: -0.15 }; st.push(central);
  const lines = []; const cols = shuffle(PALETTE, r); const lnames = shuffle(LINE_NAMES, r);
  function addLine(n, mode, pts, loop) {
    const ids = []; const thr = mode === 'rail' ? 0.65 : 0.5;
    for (const p of pts) { const s = at(p[0], p[1], thr); if (!ids.includes(s.id)) ids.push(s.id); }
    if (ids.length >= 2) lines.push({ id: 'l' + lines.length, n, c: cols[lines.length % cols.length], mode, st: ids, loop: !!loop });
  }
  // metro chords
  const nMetro = 4 + Math.floor(r() * 2);
  for (let i = 0; i < nMetro; i++) {
    const a = i * Math.PI / nMetro + (r() - 0.5) * 0.35;
    const dir = [Math.cos(a), Math.sin(a)], perp = [-dir[1], dir[0]];
    const off = (r() - 0.5) * 3.2, L = 6.5 + r() * 3.5, sp = 0.95 + r() * 0.35, ph = r() * 6;
    const pts = [];
    for (let t = -L; t <= L + 0.01; t += sp * (0.85 + r() * 0.3)) {
      const o = off + 0.9 * Math.sin(t * 0.33 + ph);
      pts.push([dir[0] * t + perp[0] * o + (r() - 0.5) * 0.2, dir[1] * t + perp[1] * o + (r() - 0.5) * 0.2]);
    }
    addLine(lnames[i] + ' Line', 'metro', pts);
  }
  // ring
  { const R = 3.6 + r() * 1.2, n = 13 + Math.floor(r() * 4), pts = [];
    for (let i = 0; i < n; i++) { const a = i / n * Math.PI * 2; const rr = R * (1 + (r() - 0.5) * 0.12); pts.push([Math.cos(a) * rr, Math.sin(a) * rr * 0.85]); }
    addLine('Ring Line', 'metro', pts, true); }
  // rail branches from Central
  const nRail = 2 + Math.floor(r() * 2);
  for (let i = 0; i < nRail; i++) {
    const a = r() * Math.PI * 2, L = 13 + r() * 6, pts = [[central.x, central.y]];
    for (let t = 2.2; t <= L; t += 2.2 + r() * 1.2) pts.push([central.x + Math.cos(a) * t + (r() - 0.5) * 0.6, central.y + Math.sin(a) * t + (r() - 0.5) * 0.6]);
    addLine(namer(true) + ' Railway', 'rail', pts);
  }
  // tram
  { const a = r() * Math.PI * 2, s0 = 1.5 + r() * 2, pts = [];
    for (let t = s0; t <= s0 + 6; t += 0.65) pts.push([Math.cos(a) * t + Math.sin(t) * 0.4, Math.sin(a) * t + Math.cos(t) * 0.4]);
    addLine('Tram T1', 'tram', pts); }
  // orbital bus linking outer ends
  { const ends = lines.filter(l => l.mode === 'metro' && !l.loop).map(l => l.st[l.st.length - 1]).map(id => st.find(s => s.id === id));
    ends.sort((a, b) => Math.atan2(a.y, a.x) - Math.atan2(b.y, b.x));
    const pick3 = ends.slice(0, 3);
    if (pick3.length >= 2) { const pts = []; for (let i = 0; i < pick3.length; i++) { pts.push([pick3[i].x, pick3[i].y]); if (i < pick3.length - 1) pts.push([(pick3[i].x + pick3[i + 1].x) / 2 * 0.9, (pick3[i].y + pick3[i + 1].y) / 2 * 0.9]); }
      addLine('Bus 10', 'bus', pts); } }

  const pois = []; const MUS = shuffle(['City Museum', 'Museum of Transport', 'Gallery of Modern Art', 'Natural History Museum', 'Science Museum', 'Maritime Museum'], r);
  const spec = { airport: [1, 2, 9, 14], stadium: [2, 2, 2, 7], museum: [3, 4, 0, 3.5], park: [3, 4, 1, 6], hospital: [3, 3, 1, 7], university: [2, 3, 1, 6] };
  let mi = 0;

    const [a, b, rmin, rmax] = spec[k]; const n = a + Math.floor(r() * (b - a + 1));
    for (let i = 0; i < n; i++) {

}

  tap(cx, cy) {

  }
  setOverlay(ov, key) { this.ov = ov || {}; if (key !== this.key) { this.key = key; this.drawStatic(); } }
  drawStatic() {

    s += `<rect x="${this.vb.x - w}" y="${this.vb.y - w}" width="${w * 3}" height="${this.vb.h + w * 2}" class="m-bg"/>`;
    if (ov.halo) for (const st of B.list) { const c = ov.halo(st); if (c) s += `<circle cx="${st.x}" cy="${-st.y}" r="0.85" fill="${c}" opacity="0.2"/>`; }
    if (ov.zone) s += `<circle cx="${ov.zone.x}" cy="${-ov.zone.y}" r="${ov.zone.R}" class="m-zone" stroke-width="${2 * k}" stroke-dasharray="${6 * k} ${4 * k}"/>`;
    for (const ring of B.water) s += `<path class="m-water" d="M${ring.map(q => q[0] + ',' + (-q[1])).join('L')}Z"/>`;
    const lidx = new Map([...B.L.keys()].map((id, i) => [id, i]));
    for (const pr of B.pairs.values()) {
      const A = B.S.get(pr.a), C = B.S.get(pr.b), base = B.geo.get(pr.a + '|' + pr.b) || [[A.x, A.y], [C.x, C.y]];
      const ls = pr.lines.slice().sort((a, b) => lidx.get(a) - lidx.get(b)), n = ls.length;
      ls.forEach((lid, i) => {
        const l = B.L.get(lid), px = l.mode === 'tram' ? 2.6 : l.mode === 'bus' ? 2.2 : l.mode === 'rail' ? 3.2 : 3.6;
        const off = (i - (n - 1) / 2) * 3.4 * k, pts = [];
        for (let j = 0; j < base.length; j++) {
          const p0 = base[Math.max(0, j - 1)], p1 = base[Math.min(base.length - 1, j + 1)], dx = p1[0] - p0[0], dy = p1[1] - p0[1], len = Math.hypot(dx, dy) || 1;
          pts.push((base[j][0] - dy / len * off).toFixed(4) + ',' + (-(base[j][1] + dx / len * off)).toFixed(4));
        }

        if (l.mode === 'rail') s += `<polyline points="${pts.join(' ')}" fill="none" class="m-railtie" stroke-width="${1.1 * k}" stroke-dasharray="${3 * k} ${5 * k}"/>`;
      });
    }
    if (ov.route && ov.route.length > 1) s += `<polyline points="${ov.route.map(id => { const p = B.S.get(id); return p.x + ',' + (-p.y); }).join(' ')}" class="m-route" stroke-width="${11 * k}" stroke-linejoin="round" stroke-linecap="round"/>`;
    const showPoiLbl = w < 10;
    for (const p of B.pois) {
      const z = 9 * k;
      s += `<g class="m-poi"><rect x="${p.x - z / 2}" y="${-p.y - z / 2}" width="${z}" height="${z}" rx="${2 * k}" stroke-width="${1 * k}"/><text x="${p.x}" y="${-p.y + 2.4 * k}" font-size="${6.5 * k}">${POI_GLYPH[p.k] || '?'}</text>${showPoiLbl ? `<text class="m-poil" x="${p.x + 7 * k}" y="${-p.y + 3 * k}" font-size="${9.5 * k}" stroke-width="${3 * k}">${esc(p.n)}</text>` : ''}</g>`;
    }
    for (const m of B.marks) { const z = 5 * k; s += `<g class="m-mark"><polygon points="${m.x},${-m.y - z} ${m.x + z * .8},${-m.y + z * .6} ${m.x - z * .8},${-m.y + z * .6}" stroke-width="${1.2 * k}"/>${w < 14 ? `<text x="${m.x + 7 * k}" y="${-m.y + 3 * k}" font-size="${9 * k}" stroke-width="${3 * k}">${esc(m.n)}</text>` : ''}</g>`; }
    let lbl = '';
    const order = B.list.slice().sort((a, b) => (b.id === ov.sel) - (a.id === ov.sel) || (!!(ov.marks && ov.marks[b.id])) - (!!(ov.marks && ov.marks[a.id])) || b.lines.length - a.lines.length);
    for (const st of order) {
      const inter = st.lines.length >= 2, out = ov.out && ov.out.has(st.id), mark = ov.marks && ov.marks[st.id];
      const r = (inter ? 4.4 : 3.2) * k;
      const c = inter ? 'var(--ink)' : lineCol(B.L.get(st.lines[0]).c);
      s += `<circle cx="${st.x}" cy="${-st.y}" r="${r}" class="m-st" stroke="${c}" stroke-width="${(inter ? 1.6 : 1.5) * k}"${out ? ' opacity="0.16"' : ''}/>`;
      if (mark) s += `<circle cx="${st.x}" cy="${-st.y}" r="${9 * k}" fill="none" stroke="${mark}" stroke-width="${2.4 * k}"/>`;
      if (ov.sel === st.id) s += `<circle cx="${st.x}" cy="${-st.y}" r="${11 * k}" class="m-sel" stroke-width="${2.6 * k}"/>`;
    }
    // labels: most important first, skipping any that would overlap one already placed
    const boxes = [];
    for (const st of order) {
      const sel = ov.sel === st.id, mark = ov.marks && ov.marks[st.id], out = ov.out && ov.out.has(st.id);
      if (out && !sel && !mark && w > 6) continue;
      const fs = (sel ? 12.5 : 10.5) * k, x0 = st.x + 7 * k, y0 = -st.y - 6 * k, bw = st.n.length * fs * 0.56, bh = fs * 1.25;
      const hit = boxes.some(b => x0 < b.x1 && x0 + bw > b.x0 && y0 < b.y1 && y0 + bh > b.y0);
      if (hit && !sel) continue;
      boxes.push({ x0: x0 - 2 * k, x1: x0 + bw + 2 * k, y0, y1: y0 + bh });
      lbl += `<text class="m-lbl${out ? ' out' : ''}${sel ? ' sel' : ''}" x="${x0}" y="${-st.y + 3.5 * k}" font-size="${fs}" stroke-width="${3 * k}">${esc(st.n)}</text>`;
    }
    this.gs.innerHTML = s + lbl;
  }
  drawDyn(items) {
    const k = this.k; let s = '';
    for (const it of items) {
      const r = (it.me ? 9 : 7.5) * k;
      if (it.ghost) s += `<g class="m-ghost"><circle cx="${it.x}" cy="${-it.y}" r="${r}" stroke="${it.c}" stroke-width="${2 * k}" stroke-dasharray="${3 * k} ${2.5 * k}"/><text x="${it.x}" y="${-it.y + 3.4 * k}" font-size="${9 * k}" fill="${it.c}">${esc(it.label)}</text></g>`;
      else s += `<g class="m-tok">${it.me ? `<circle cx="${it.x}" cy="${-it.y}" r="${r + 3.5 * k}" class="m-me" stroke-width="${2 * k}"/>` : ''}<circle cx="${it.x}" cy="${-it.y}" r="${r}" fill="${it.c}" stroke-width="${1.8 * k}"/><text x="${it.x}" y="${-it.y + 3.4 * k}" font-size="${9.5 * k}">${esc(it.label)}</text></g>`;
    }
    this.gd.innerHTML = s;
  }
}

async function buildCity(city) {
  const su = S.setup; city = city.trim();
  if (!city) { su.status = 'Type a city name first.'; renderSetup(); return; }
  if (!S.sample) { su.status = 'Building real cities needs this page open in Claude. Use a fictional city here instead.'; renderSetup(); return; }
  su.city = city; su.busy = true; su.status = `Asking Claude to draw ${city}'s network. This usually takes 20 to 60 seconds.`; renderSetup();
  const ctl = new AbortController(); su.ctl = ctl;
  const prompt = `Build a simplified but recognisable public transport network for ${city}, for a map-based board game.
Reply with only JSON in exactly this shape:
{"city":"${city}","stations":[{"id":"a1","n":"Station name","lat":51.5074,"lng":-0.1278}],"lines":[{"n":"Line name","c":"#RRGGBB","mode":"metro","st":["a1","a2"],"loop":false}],"pois":[{"n":"Place name","k":"museum","lat":51.5,"lng":-0.12}]}
Rules:
- 45 to 110 real stations with their real names and approximate real coordinates (4 decimal places).
- 5 to 12 real lines. mode is one of metro, rail, tram, bus. Use each line's official colour as a hex code. List each line's stations in order along the route. Set loop to true only for circular lines.
- An interchange appears once in stations and is referenced by every line that serves it.
- If the city has little rail transit, include its main tram or bus routes as lines.
- Choose the central and best-known parts of the network if the full system is larger.
- 10 to 18 places of interest, with k one of airport, stadium, museum, park, hospital, university.
- No comments and no text outside the JSON.`;
  try {
    const raw = await S.sample.json(prompt, { signal: ctl.signal, cache: { gcTime: 86400000 } });
    const b = normalizeClaude(raw, city);
    const B = prepare(b);
    su.raw = b; su.B = B; su.preset = null; su.settings = Object.assign(defaultSettings(su.mode, B), { rate: su.settings.rate });
    su.status = `Built ${city}: ${boardStats(B)}. Positions are approximate. Tap stations on the preview to check them.`;
  } catch (e) {
    const c = e && e.code;
    su.status = c === 'cancelled' ? 'Stopped.' : c === 'not_granted' || c === 'sampling_disabled' ? 'Claude access was not allowed for this page, so only fictional cities are available.' : c === 'rate_limited' ? 'Claude is busy or you have hit a usage limit. Try again later, or use a fictional city.' : c === 'invalid_json' ? `Claude's answer for ${city} could not be read as a network. Try again, or try a more specific name.` : (e && e.message && !c) ? `That network did not work: ${e.message} Try again or use a fictional city.` : 'Something went wrong building that city. Try again, or use a fictional city.';
  }
  su.busy = false; su.ctl = null; renderSetup();
}

async function joinGame(code, nick) {
  code = String(code || '').toUpperCase().trim();
  const d = await S.db.doc('games/' + code).get();
  if (!d.exists) { const m = $('#joinMsg'); if (m) m.textContent = `No game called ${code}. Check the code with your host.`; return; }
  const g = d.data();
  const pd = await S.db.doc('games/' + code + '/players/' + S.me).get();

/* ---------- challenges ---------- */
function chSeed() { return S.code + epochKey(); }
function challengeState(T, stId) {
  const g = S.game, pl = myPl(); if (!pl) return { ok: false };
  if (g.mode === 'hide') return { ok: false, hide: true };
  if (g.mode === 'tag' && role() === 'chaser') return { ok: false, why: 'Chasers don’t do challenges.' };
  const c = challengeAt(S.B, stId, chSeed(), g.mode);
  if (pl.done && pl.done[stId]) return { ok: false, c, why: 'You have already done this station’s challenge.' };
  if (pl.busy && pl.busy.until > T) return { ok: false, c, why: 'Finish your current challenge first.' };
  if (pl.quest && c.kind === 'errand') return { ok: false, c, why: 'You already have an errand running.' };
  if (g.mode === 'territory') { const d = S.B.S.get(stId).d, lk = (pl.lock || {})[d]; if (lk > T) return { ok: false, c, why: `Locked out of this district until ${fmtClock(lk).hm}.` }; }
  const p = myJ() && posAt(myJ(), T);
  if (!p || !p.stat || p.at !== stId) return { ok: false, c, why: 'Stop at this station to try its challenge.' };
  return { ok: true, c };
}
function rid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 6); }
function finishChallenge(c, val, mins) {
  const T = now(), pl = myPl();
  saveMe(Object.assign({}, pl, { busy: { id: rid(), until: r2(T + mins), val, st: c.st, kind: c.kind }, done: Object.assign({}, pl.done, { [c.st]: true }) }));
}
async function resolveBusy(b) {
  const g = S.game, T = now(), pl = myPl();
  if (g.mode === 'territory') {
    const st = S.B.S.get(b.st), d = st.d, cur = (g.claims || {})[d], team = pl.team || 'A';
    const ok = b.val > 0 && (!cur || b.val > cur.v);
    if (ok) {
      await saveMe(Object.assign({}, myPl(), { busy: null }));
      await updGame({ claims: { [d]: { team, v: b.val, by: S.me, t: r2(T) } } });
      await addEvent({ type: 'claim', d, team, v: b.val, prev: cur ? cur.team : null, t: r2(T) });
    } else {
      const own = cur && cur.team === team;
      await saveMe(Object.assign({}, myPl(), { busy: null, lock: Object.assign({}, myPl().lock || {}, own ? {} : { [d]: r2(T + g.settings.lock) }) }));
      await addEvent({ type: 'fail', d, v: b.val, need: cur ? cur.v + 1 : 1, own: !!own, t: r2(T) });
    }
    return;
  }
  await saveMe(Object.assign({}, myPl(), { busy: null, coins: (myPl().coins || 0) + b.val }));
  await addEvent({ type: 'chal', kind: b.kind, st: b.st, val: b.val, t: r2(T) });
}
async function finishQuest(ok) {
  const pl = myPl(), q = pl.quest, T = now();
  await saveMe(Object.assign({}, pl, { quest: null, coins: (pl.coins || 0) + (ok ? q.val : 0) }));
  await addEvent({ type: ok ? 'chal' : 'errfail', kind: 'errand', st: q.target, val: ok ? q.val : 0, t: r2(T) });
  toast(ok ? `Errand done: +${q.val} coins.` : 'Errand deadline missed.');
}

/* ---------- travel ---------- */
function needsFare() { const g = S.game; return g && (g.mode === 'race' || (g.mode === 'tag' && role() === 'runner')); }
function travelBlock(T) {
  const g = S.game; if (!g || g.phase !== 'play') return 'The game is not running.';
  if (!S.game.clock.run) return 'The clock is paused.';
  const pl = myPl(); if (!pl || pl.rn !== epochKey()) return 'Getting ready…';
  if (g.mode === 'hide') {
    const rd = g.round; if (!rd || rd.status === 'done') return 'This round is over.';
    if (role() === 'hider') { const lm = lastMove(); if (T < rd.hideEnd || (lm && lm.until > T)) return ''; return 'You’re hiding. Stay put unless you play Relocate.'; }
  }
  const e = effectsFor(ctx(), S.me, T);
  if (e.frozen > T) return `${e.why}. You can leave at ${fmtClock(e.frozen).hm}.`;
  return '';
}
function planRoute(T, to) {
  const j = myJ(); if (!j) return null;
  const dp = departurePoint(j, T); if (!dp) return null;
  const e = effectsFor(ctx(), S.me, T);
  const key = [dp.s, dp.t.toFixed(1), to, [...e.blocked].join(','), e.noWalk, e.slow].join('|');
  if (S.rp && S.rp.key === key) return S.rp;
  const r = route(S.B, dp.s, to, dp.t, { blocked: e.blocked, noWalk: e.noWalk, slow: e.slow });
  S.rp = { key, r, dp, to }; return S.rp;
}
function depart(to) {
  const T = now(), why = travelBlock(T); if (why) { toast(why); return; }
  const rp = planRoute(T, to); if (!rp || !rp.r) { toast('No route from here with the current restrictions.'); return; }
  const fare = needsFare() ? rp.r.fare : 0, pl = myPl();
  if (fare > (pl.coins || 0)) { toast(`That trip costs ${fare} coins and you have ${pl.coins || 0}. Walk, or earn coins with a challenge.`); return; }
  const j = { wps: rp.dp.keep.concat(rp.r.wps.slice(1)) };
  setMyJ(j, fare ? { coins: (pl.coins || 0) - fare } : null);
  S.rp = null; toast(`Departing for ${S.B.S.get(to).n}. Arrive ${fmtClock(jEnd(j).t).hm}.`);
}
function stopNext() { const T = now(), j = myJ(); if (!j || !isMoving(j, T)) return; setMyJ(truncate(j, T)); }

/* ---------- clues for seekers ---------- */
let clueCache = { key: '', v: null };
function clues(T) {
  const g = S.game, rd = g.round, B = S.B; if (!rd) return null;
  const evs = roundEvents(), lm = lastMove(evs), after = lm ? lm.until : rd.hideEnd;
  const seenAll = []; for (const p of S.players.values()) if (p.rn === epochKey()) for (const x of p.seen || []) if (x.t >= after) seenAll.push(x.s);
  const key = [epochKey(), evs.length, seenAll.length, after].join('|');
  if (clueCache.key === key) return clueCache.v;
  const qById2 = new Map(evs.filter(e => e.type === 'q').map(e => [e.id, e]));
  const answers = evs.filter(e => e.type === 'ans' && e.t >= after && qById2.has(e.qid)).map(e => ({ qid: e.q, ctx: qById2.get(e.qid).ctx, ans: e.ans, ev: e }));
  const zev = evs.filter(e => e.type === 'zone' && e.t >= after).pop();
  const zone = zev ? { s: zev.s, R: zev.R } : null;
  const cands = candidates(B, { answers, seen: new Set(seenAll), zone });
  const v = { answers, zone, cands, candSet: new Set(cands.map(s => s.id)), seen: new Set(seenAll), key };
  clueCache = { key, v }; return v;
}

/* ================= PLATFORM ZERO — app: panels, map overlay, actions, mini-games, boot ================= */
const stName = id => { const s = S.B && S.B.S.get(id); return s ? s.n : '—'; };
const lineChip = (lid, extra) => { const l = S.B.L.get(lid); if (lid === 'walk') return `<span class="lchip walk">Walk${extra ? ' ' + extra : ''}</span>`; return l ? `<span class="lchip" style="--lc:${lineCol(l.c)}">${esc(l.n)}${extra ? ' ' + extra : ''}</span>` : ''; };

/* ---------- tabs ---------- */

        <button class="primary" data-act="depart" data-id="${sel}"${fare > (myPl().coins || 0) ? ' disabled' : ''}>${fare > (myPl().coins || 0) ? 'Not enough coins' : 'Depart'}</button></div>`;

/* ---------- hide & seek tabs ---------- */

function tokens(T) {
  const g = S.game, B = S.B, items = []; if (!g || !B) return items;

  const add = (uid, j) => { const p = xyAt(B, j, T); if (p) items.push({ x: p.x, y: p.y, c: colorOf(uid), label: initialOf(uid), me: uid === S.me }); };
  for (const [uid, p] of S.players) { if (p.rn !== ep || !p.j) continue; add(uid, p.j); }
  if (g.mode === 'hide' && role() === 'hider' && S.priv && S.priv.j) add(S.me, S.priv.j);
  if (g.mode === 'tag') {
    if (role() === 'runner' && S.priv && S.priv.j) add(S.me, S.priv.j);
    for (const [uid, p] of S.players) {

      const a = B.S.get(p.rv.s); if (!a) continue; const b = p.rv.nx && B.S.get(p.rv.nx);

/* ---------- photo answers (drawn from map data on the hider's phone) ---------- */
function shapeSvg(sh, x, y0, H, fill) {
  const f = `fill="${fill}"`, st = `stroke="${fill}"`, P = pts => `<polygon ${f} points="${pts.map(p => p[0].toFixed(1) + ',' + p[1].toFixed(1)).join(' ')}"/>`;
  const R = (cx, w, top, bot) => `<rect ${f} x="${(cx - w / 2).toFixed(1)}" y="${top.toFixed(1)}" width="${w.toFixed(1)}" height="${(bot - top).toFixed(1)}"/>`;
  const sw = Math.max(1.2, H * 0.025);
  switch (sh) {
    case 'shard': return P([[x - .18 * H, y0], [x + .18 * H, y0], [x + .03 * H, y0 - H], [x - .05 * H, y0 - .92 * H]]);
    case 'pyramid': return R(x, .28 * H, y0 - .84 * H, y0) + P([[x - .14 * H, y0 - .84 * H], [x + .14 * H, y0 - .84 * H], [x, y0 - H]]);
